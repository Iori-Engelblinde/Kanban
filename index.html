<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Pixel</title>
    <style>
        :root {
            --preto: #1a1a1a;
            --preto-escuro: #121212;
            --preto-claro: #2a2a2a;
            --cinza: #3a3a3a;
            --cinza-claro: #4a4a4a;
            --branco: #ffffff;
            --branco-suave: #f0f0f0;
            --laranja: #ff6b35;
            --laranja-claro: #ff8c5a;
            --laranja-escuro: #e55a2b;
            --laranja-hover: #ff9d70;
            --laranja-click: #ff4500;
            --pixel-size: 4px;
            --border-radius: 8px;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pixel Font', monospace;
        }

        @font-face {
            font-family: 'Pixel Font';
            src: local('Courier New'), local('Monaco'), local('Consolas');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: var(--preto-escuro);
            color: var(--branco);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        /* Pixel effect background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(45deg, rgba(255,107,53,0.03) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,107,53,0.03) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,107,53,0.03) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,107,53,0.03) 75%);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 20px;
            background-color: var(--preto);
            border: 2px solid var(--laranja);
            border-radius: var(--border-radius);
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--laranja);
            text-shadow: 2px 2px 0px var(--preto-escuro);
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--branco);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            margin-bottom: 30px;
            background-color: var(--preto);
            border: 2px solid var(--laranja);
            border-radius: var(--border-radius);
            padding: 15px;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--branco-suave);
        }

        .progress-bar-container {
            height: 20px;
            background-color: var(--cinza);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--preto-claro);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--laranja-escuro), var(--laranja), var(--laranja-claro));
            border-radius: 10px;
            transition: var(--transition);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: var(--laranja);
            font-weight: bold;
        }

        /* Add Task Form */
        .add-task-container {
            margin-bottom: 30px;
            background-color: var(--preto);
            border: 2px solid var(--laranja);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
        }

        .add-task-header {
            font-size: 18px;
            color: var(--laranja);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .form-input {
            flex: 1;
            padding: 10px;
            background-color: var(--cinza);
            border: 1px solid var(--preto-claro);
            border-radius: var(--border-radius);
            color: var(--branco);
            font-family: 'Pixel Font', monospace;
            font-size: 14px;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--laranja);
            box-shadow: 0 0 5px rgba(255, 107, 53, 0.5);
        }

        .form-input::placeholder {
            color: var(--branco-suave);
        }

        .tag-select {
            padding: 10px;
            background-color: var(--cinza);
            border: 1px solid var(--preto-claro);
            border-radius: var(--border-radius);
            color: var(--branco);
            font-family: 'Pixel Font', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            min-width: 150px;
        }

        .tag-select:focus {
            outline: none;
            border-color: var(--laranja);
            box-shadow: 0 0 5px rgba(255, 107, 53, 0.5);
        }

        .btn {
            padding: 10px 20px;
            background-color: var(--laranja);
            border: none;
            border-radius: var(--border-radius);
            color: var(--branco);
            font-family: 'Pixel Font', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 2px 2px 0px var(--preto-escuro);
        }

        .btn:hover {
            background-color: var(--laranja-hover);
            transform: translateY(-1px);
            box-shadow: 3px 3px 0px var(--preto-escuro);
        }

        .btn:active {
            background-color: var(--laranja-click);
            transform: translateY(1px);
            box-shadow: 1px 1px 0px var(--preto-escuro);
        }

        .btn-secondary {
            background-color: var(--cinza);
            color: var(--branco);
        }

        .btn-secondary:hover {
            background-color: var(--cinza-claro);
        }

        /* Kanban Board */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .kanban-column {
            background-color: var(--preto);
            border: 2px solid var(--laranja);
            border-radius: var(--border-radius);
            padding: 15px;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--cinza);
        }

        .column-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--laranja);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .column-count {
            background-color: var(--cinza);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--branco);
        }

        .tasks-container {
            min-height: 100px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .empty-message {
            text-align: center;
            color: var(--branco-suave);
            font-size: 14px;
            padding: 20px;
        }

        /* Task Card */
        .task-card {
            background-color: var(--preto-claro);
            border: 1px solid var(--cinza);
            border-radius: var(--border-radius);
            padding: 15px;
            transition: var(--transition);
            position: relative;
        }

        .task-card:hover {
            border-color: var(--laranja);
            box-shadow: 0 0 8px rgba(255, 107, 53, 0.2);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--branco);
            word-break: break-word;
            flex: 1;
        }

        .task-actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 4px;
            background-color: var(--preto);
            color: var(--branco);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background-color: var(--cinza);
        }

        .action-btn:active {
            background-color: var(--laranja);
        }

        .action-btn.delete:hover {
            background-color: #ff4444;
        }

        .action-btn.delete:active {
            background-color: #cc0000;
        }

        .task-tag {
            display: inline-block;
            padding: 4px 8px;
            background-color: var(--laranja);
            color: var(--branco);
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-description {
            font-size: 12px;
            color: var(--branco-suave);
            margin-top: 8px;
            line-height: 1.4;
        }

        .task-status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            color: var(--branco-suave);
        }

        /* Status indicators */
        .status-todo { border-left: 4px solid var(--laranja); }
        .status-doing { border-left: 4px solid var(--laranja-claro); }
        .status-done { border-left: 4px solid #4CAF50; opacity: 0.8; }

        .status-done .task-title {
            text-decoration: line-through;
            color: var(--branco-suave);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background-color: var(--preto);
            border: 2px solid var(--laranja);
            border-radius: var(--border-radius);
            padding: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
            transform: scale(0.9);
            transition: var(--transition);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            color: var(--laranja);
            font-weight: bold;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--branco);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-close:hover {
            color: var(--laranja);
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--preto);
            border: 2px solid var(--laranja);
            border-radius: var(--border-radius);
            padding: 12px 20px;
            color: var(--branco);
            font-size: 14px;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 1001;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .kanban-board {
                grid-template-columns: 1fr;
            }

            .form-row {
                flex-direction: column;
                gap: 10px;
            }

            .tag-select {
                min-width: 100%;
            }
        }

        /* Pixel art icons for actions */
        .icon-complete {
            width: 12px;
            height: 12px;
            background-color: currentColor;
            border-radius: 2px;
            position: relative;
        }

        .icon-complete::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 6px;
            height: 6px;
            background-color: var(--preto);
            border-radius: 1px;
        }

        .icon-edit {
            width: 12px;
            height: 12px;
            background-color: currentColor;
            border-radius: 2px;
            position: relative;
        }

        .icon-edit::before {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            width: 8px;
            height: 2px;
            background-color: var(--preto);
            border-radius: 1px;
        }

        .icon-edit::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 1px;
            width: 6px;
            height: 2px;
            background-color: var(--preto);
            border-radius: 1px;
        }

        .icon-delete {
            width: 12px;
            height: 12px;
            background-color: currentColor;
            border-radius: 2px;
            position: relative;
        }

        .icon-delete::before {
            content: '';
            position: absolute;
            top: 1px;
            left: 4px;
            width: 2px;
            height: 8px;
            background-color: var(--preto);
            border-radius: 1px;
        }

        .icon-delete::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 1px;
            width: 8px;
            height: 2px;
            background-color: var(--preto);
            border-radius: 1px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">KANBAN <span>PIXEL</span></div>
    </header>

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-header">
            <span>Progresso Geral</span>
            <span id="progressPercentage">0%</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>
        <div class="progress-text" id="progressText">0 de 0 tarefas concluídas</div>
    </div>

    <!-- Add Task Form -->
    <div class="add-task-container">
        <div class="add-task-header">➕ Adicionar Nova Tarefa</div>
        <div class="form-group">
            <div class="form-row">
                <input type="text" class="form-input" id="taskName" placeholder="Digite o nome da tarefa..." required>
                <select class="tag-select" id="taskTag">
                    <option value="">Selecione uma tag</option>
                    <option value="estudo">Estudo</option>
                    <option value="assistir">Assistir</option>
                    <option value="jogar">Jogar</option>
                    <option value="trabalho">Trabalho</option>
                    <option value="ler">Ler</option>
                    <option value="exercicio">Exercício</option>
                    <option value="comprar">Comprar</option>
                    <option value="outro">Outro</option>
                </select>
                <button class="btn" onclick="addTask()">ADICIONAR</button>
            </div>
        </div>
        <div class="form-group">
            <input type="text" class="form-input" id="taskDescription" placeholder="Descrição (opcional)...">
        </div>
    </div>

    <!-- Kanban Board -->
    <div class="kanban-board">
        <!-- To Do Column -->
        <div class="kanban-column">
            <div class="column-header">
                <div class="column-title">⏳ Para Fazer</div>
                <div class="column-count" id="todoCount">0</div>
            </div>
            <div class="tasks-container" id="todoTasks">
                <div class="empty-message">Nenhuma tarefa na lista</div>
            </div>
        </div>

        <!-- Doing Column -->
        <div class="kanban-column">
            <div class="column-header">
                <div class="column-title">⚡ Fazendo</div>
                <div class="column-count" id="doingCount">0</div>
            </div>
            <div class="tasks-container" id="doingTasks">
                <div class="empty-message">Nenhuma tarefa em andamento</div>
            </div>
        </div>

        <!-- Done Column -->
        <div class="kanban-column">
            <div class="column-header">
                <div class="column-title">✅ Concluído</div>
                <div class="column-count" id="doneCount">0</div>
            </div>
            <div class="tasks-container" id="doneTasks">
                <div class="empty-message">Nenhuma tarefa concluída</div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">✏️ Editar Tarefa</div>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <input type="text" class="form-input" id="editTaskName" placeholder="Nome da tarefa...">
                </div>
                <div class="form-group">
                    <input type="text" class="form-input" id="editTaskDescription" placeholder="Descrição...">
                </div>
                <div class="form-group">
                    <select class="tag-select" id="editTaskTag">
                        <option value="">Selecione uma tag</option>
                        <option value="estudo">Estudo</option>
                        <option value="assistir">Assistir</option>
                        <option value="jogar">Jogar</option>
                        <option value="trabalho">Trabalho</option>
                        <option value="ler">Ler</option>
                        <option value="exercicio">Exercício</option>
                        <option value="comprar">Comprar</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditModal()">CANCELAR</button>
                <button class="btn" onclick="saveEdit()">SALVAR</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // Dados das tarefas
        let tasks = JSON.parse(localStorage.getItem('kanban_tasks')) || [];
        let editingTaskId = null;

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            renderTasks();
            updateProgress();
            
            // Permitir adicionar tarefa com Enter
            document.getElementById('taskName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
        });

        // Adicionar nova tarefa
        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            const tag = document.getElementById('taskTag').value;
            const description = document.getElementById('taskDescription').value.trim();

            if (!name) {
                showToast('Por favor, digite um nome para a tarefa!', 'error');
                return;
            }

            const newTask = {
                id: Date.now().toString(),
                name: name,
                tag: tag || 'outro',
                description: description,
                status: 'todo',
                createdAt: new Date().toISOString()
            };

            tasks.push(newTask);
            saveTasks();
            renderTasks();
            updateProgress();
            
            // Limpar campos
            document.getElementById('taskName').value = '';
            document.getElementById('taskDescription').value = '';
            document.getElementById('taskTag').value = '';
            
            showToast('Tarefa adicionada com sucesso!');
        }

        // Renderizar todas as tarefas
        function renderTasks() {
            const todoTasks = tasks.filter(task => task.status === 'todo');
            const doingTasks = tasks.filter(task => task.status === 'doing');
            const doneTasks = tasks.filter(task => task.status === 'done');

            renderTaskList('todoTasks', todoTasks, 'todo');
            renderTaskList('doingTasks', doingTasks, 'doing');
            renderTaskList('doneTasks', doneTasks, 'done');

            // Atualizar contadores
            document.getElementById('todoCount').textContent = todoTasks.length;
            document.getElementById('doingCount').textContent = doingTasks.length;
            document.getElementById('doneCount').textContent = doneTasks.length;
        }

        // Renderizar lista de tarefas para uma coluna
        function renderTaskList(containerId, taskList, status) {
            const container = document.getElementById(containerId);
            
            if (taskList.length === 0) {
                container.innerHTML = '<div class="empty-message">Nenhuma tarefa nesta lista</div>';
                return;
            }

            container.innerHTML = taskList.map(task => createTaskCard(task, status)).join('');
        }

        // Criar card de tarefa
        function createTaskCard(task, status) {
            const tagClass = getTagColor(task.tag);
            const descriptionHtml = task.description ? `<div class="task-description">${task.description}</div>` : '';
            
            return `
                <div class="task-card status-${status}" data-task-id="${task.id}">
                    <div class="task-header">
                        <div class="task-title">${task.name}</div>
                        <div class="task-actions">
                            ${status !== 'done' ? `
                                <button class="action-btn" onclick="moveTask('${task.id}', 'done')" title="Concluir">
                                    <span class="icon-complete"></span>
                                </button>
                            ` : ''}
                            <button class="action-btn" onclick="openEditModal('${task.id}')" title="Editar">
                                <span class="icon-edit"></span>
                            </button>
                            <button class="action-btn delete" onclick="deleteTask('${task.id}')" title="Excluir">
                                <span class="icon-delete"></span>
                            </button>
                        </div>
                    </div>
                    ${descriptionHtml}
                    <div class="task-tag" style="background-color: ${tagClass}">${task.tag}</div>
                </div>
            `;
        }

        // Obter cor da tag
        function getTagColor(tag) {
            const colors = {
                'estudo': '#4CAF50',
                'assistir': '#9C27B0',
                'jogar': '#2196F3',
                'trabalho': '#FF5722',
                'ler': '#FFC107',
                'exercicio': '#8BC34A',
                'comprar': '#E91E63',
                'outro': '#795548'
            };
            return colors[tag] || '#795548';
        }

        // Mover tarefa para outra coluna
        function moveTask(taskId, newStatus) {
            const task = tasks.find(task => task.id === taskId);
            if (task) {
                task.status = newStatus;
                saveTasks();
                renderTasks();
                updateProgress();
                showToast('Tarefa movida!');
            }
        }

        // Excluir tarefa
        function deleteTask(taskId) {
            if (confirm('Tem certeza que deseja excluir esta tarefa?')) {
                tasks = tasks.filter(task => task.id !== taskId);
                saveTasks();
                renderTasks();
                updateProgress();
                showToast('Tarefa excluída!');
            }
        }

        // Abrir modal de edição
        function openEditModal(taskId) {
            const task = tasks.find(task => task.id === taskId);
            if (task) {
                editingTaskId = taskId;
                document.getElementById('editTaskName').value = task.name;
                document.getElementById('editTaskDescription').value = task.description || '';
                document.getElementById('editTaskTag').value = task.tag;
                document.getElementById('editModal').classList.add('active');
            }
        }

        // Fechar modal de edição
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingTaskId = null;
        }

        // Salvar edição
        function saveEdit() {
            const name = document.getElementById('editTaskName').value.trim();
            const description = document.getElementById('editTaskDescription').value.trim();
            const tag = document.getElementById('editTaskTag').value;

            if (!name) {
                showToast('Por favor, digite um nome para a tarefa!', 'error');
                return;
            }

            const task = tasks.find(task => task.id === editingTaskId);
            if (task) {
                task.name = name;
                task.description = description;
                task.tag = tag || 'outro';
                saveTasks();
                renderTasks();
                closeEditModal();
                showToast('Tarefa atualizada!');
            }
        }

        // Salvar tarefas no localStorage
        function saveTasks() {
            localStorage.setItem('kanban_tasks', JSON.stringify(tasks));
        }

        // Atualizar barra de progresso
        function updateProgress() {
            const totalTasks = tasks.length;
            const doneTasks = tasks.filter(task => task.status === 'done').length;
            
            const percentage = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
            
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressPercentage').textContent = percentage + '%';
            document.getElementById('progressText').textContent = doneTasks + ' de ' + totalTasks + ' tarefas concluídas';
        }

        // Mostrar toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show';
            
            // Remover toast após 3 segundos
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Fechar modal ao clicar fora
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
